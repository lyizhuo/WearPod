name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.4.10)"
        required: true
        type: string

permissions:
  contents: write  # 需创建 GitHub Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # 去掉 v 前缀
          VN="${TAG#v}"
          if [[ ! "$VN" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must be vMAJOR.MINOR.PATCH, got: $TAG"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          # 由 semver 直接推导，避免 tag 数量/预发布 tag/删 tag 导致 versionCode 漂移。
          # 1.6.2 -> 1006002；1.7.0 -> 1007000，天然单调且和版本号对应。
          VC=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "versionName=$VN" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VC" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> name=$VN code=$VC (semver-derived)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::KEYSTORE_B64 secret 未配置，拒绝产出未签名 release"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wearpod.p12"
          test -s "$RUNNER_TEMP/wearpod.p12"

      - name: Build signed release AAB/APK
        env:
          ORG_GRADLE_PROJECT_wearpodKeystorePath: ${{ runner.temp }}/wearpod.p12
          ORG_GRADLE_PROJECT_wearpodKeystorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_wearpodKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_wearpodKeyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease \
            -PwearpodVersionName=${{ steps.version.outputs.versionName }} \
            -PwearpodVersionCode=${{ steps.version.outputs.versionCode }} \
            --stacktrace

      - name: Verify signer cert and versionCode
        env:
          EXPECTED_SIGNER_SHA256: "cdee650a15a0ed7f1881fb57199e9e333ae562eb9d886b33386cccc2835bca87"
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::未生成签名 APK（只有 -unsigned 产物？）"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          # 不要用 head 截断 apksigner/aapt2 的输出：pipefail 下写端会因 SIGPIPE 以 141 结束，误判为步骤失败
          CERTS="$("$BT/apksigner" verify --print-certs "$APK")"
          echo "$CERTS"
          # 标签格式随 build-tools 版本变化（"Signer #1 certificate SHA-256 digest:" / "V2 Signer: certificate SHA-256 digest:"），
          # 因此不匹配前缀，改为取出全部签名证书指纹再判断期望值是否在其中
          FP="$(printf '%s\n' "$CERTS" | sed -n 's/.*certificate SHA-256 digest: *//p' | tr -d ':[:space:]' | tr 'A-F' 'a-f' | tr '\n' ' ')"
          echo "signer sha256: $FP"
          printf '%s\n' "$FP" | tr ' ' '\n' | grep -qxF "$EXPECTED_SIGNER_SHA256" || { echo "::error::签名证书不匹配，停止发版"; exit 1; }
          BADGING="$("$BT/aapt2" dump badging "$APK" | sed -n '1p')"
          echo "$BADGING"
          # 必须锚定 "package: " 行首：compileSdkVersionCodename='16' 里也含小写 name='，贪婪匹配会误取
          PKG="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VC="$(printf '%s\n' "$BADGING" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")"
          [ "$PKG" = "site.whitezaak.wearpod" ] || { echo "::error::applicationId 变了: $PKG"; exit 1; }
          [ "${VC:-0}" -gt 149 ] || { echo "::error::versionCode=$VC 未大于已发布的 149，存量用户无法覆盖升级"; exit 1; }

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VN="${{ steps.version.outputs.versionName }}"
          # release-please 已经把完整 changelog 写进 CHANGELOG.md；优先用它。
          # 否则 GitHub generate-notes 只会列出 "chore(master): release x.y.z" 这一条 bot commit。
          awk -v ver="$VN" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              gh api repos/${{ github.repository }}/releases/generate-notes \
                -f tag_name="$TAG" -f previous_tag_name="$PREV" --jq .body > /tmp/notes.md || true
            fi
          fi
          if [ ! -s /tmp/notes.md ]; then
            echo "发布 $TAG" > /tmp/notes.md
          fi
          # 在此可追加 LLM 润色：读 /tmp/notes.md 重写后再输出
          {
            echo "body<<EOF"
            cat /tmp/notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Name APK asset
        run: cp app/build/outputs/apk/release/app-release.apk "WearPod-V${{ steps.version.outputs.versionName }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            app/build/outputs/bundle/release/*.aab
            WearPod-*.apk
          generate_release_notes: false
