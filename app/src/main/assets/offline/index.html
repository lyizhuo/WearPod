<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title data-i18n="docTitle">WearPod 本地上传</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="hero-copy">
      <h1 data-i18n="heading">WearPod 本地上传</h1>
      <p class="subtitle" data-i18n="subtitle">文件只保存在手表本地</p>
    </div>
    <button id="done-btn" class="btn btn-done" type="button" data-i18n="doneAction">完成</button>
  </header>

  <section class="card">
    <h2 data-i18n="uploadTitle">上传 OPML</h2>
    <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-describedby="filename">
      <p class="dropzone-text" data-i18n="dropzone">拖拽 OPML 到此处，或点击选择文件（.opml / .xml）</p>
      <p id="filename" class="filename"></p>
    </div>
    <input id="file-input" class="visually-hidden" type="file" tabindex="-1" aria-label="OPML" accept=".opml,.xml,text/xml,application/xml">
    <button id="import-btn" class="btn btn-primary" type="button" disabled data-i18n="importAction">导入</button>
    <p id="status" class="status" role="status"></p>
  </section>

  <section class="card">
    <div class="feeds-header">
      <h2 id="feeds-title">当前订阅（0）</h2>
      <button id="select-btn" class="btn-inline" type="button" data-i18n="selectAction" hidden>选择</button>
      <div id="selection-toolbar" class="selection-toolbar" hidden>
        <label class="select-all">
          <input id="select-all" class="feed-check" type="checkbox">
          <span data-i18n="selectAll">全选</span>
        </label>
        <button id="bulk-delete-btn" class="icon-btn icon-btn-danger" type="button" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="M19 6l-1 14H6L5 6"></path>
            <path d="M10 11v5M14 11v5"></path>
          </svg>
          <span class="visually-hidden" data-i18n="delete">删除</span>
        </button>
        <button id="cancel-select-btn" class="icon-btn" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
          <span class="visually-hidden" data-i18n="cancelSelection">取消选择</span>
        </button>
      </div>
    </div>
    <ul id="feed-list" class="feed-list"></ul>
    <p id="feed-empty" class="empty" data-i18n="empty">暂无订阅</p>
  </section>
</main>
</body>
</html>
